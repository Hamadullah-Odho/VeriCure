spring.application.name=vericure-backend

# ------------------------------------------------------------
# Database — set these via environment variables, not here.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vericure_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# FastAPI Model Service
# ============================================================

model.api.url=${MODEL_API_URL:http://localhost:8001}

# Automatically start FastAPI when Spring Boot starts
model.api.auto-start=${MODEL_API_AUTO_START:true}

# Python command
model.api.python=${MODEL_API_PYTHON:py}

# Path to the FastAPI project folder — set MODEL_API_PATH to an
# absolute path on your machine (e.g. via your IDE's run
# configuration, or a real environment variable). Left unset by
# default rather than hardcoded to any one developer's machine.
model.api.path=${MODEL_API_PATH:./model-api}

# ------------------------------------------------------------
# Gemini API — set these via environment variables, not here.
# Never commit a real key to this file.
# ------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}

# ------------------------------------------------------------
# Gmail SMTP (used for OTP emails) — set these via environment
# variables. spring.mail.password must be a Gmail App Password,
# not your actual account password.
# ------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.jpa.open-in-view=false

# Admin web dashboard JWT signing secret (32+ chars). If unset,
# AdminJwtUtil generates a random one at startup with a warning
# — fine for local dev, but set a real fixed one via
# ADMIN_JWT_SECRET before any real deployment.
admin.jwt.secret=${ADMIN_JWT_SECRET:}